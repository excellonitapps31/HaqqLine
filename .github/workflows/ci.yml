name: Verify and deploy

on:
  push:
    branches: [main, "phase/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # Per-ref so PR verifies do not cancel each other (or leave CANCELLED
  # siblings on the same SHA). Main/phase deploys still serialize per branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PHP CLI
        run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
      - name: Install Python deps
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          python -m compileall tests scripts
          php -l public/api/v1/index.php
          php -l public/api/v1/HaqqLineApi.php
          php -l public/api/v1/HaqqLinePolicy.php
          php -l public/api/v1/HaqqLineCaseStore.php
          php -l public/api/v1/HaqqLineSms.php
          php -l public/router.php
      - name: Pack content lock
        run: python3 scripts/verify_pack_lock.py
      - name: Tests
        run: pytest -q tests/phase1 tests/phase2 tests/phase3/test_play_markup.py tests/phase4 tests/phase5 tests/phase6 tests/phase7 tests/phase8 tests/phase9 tests/phase10 tests/phase11 tests/phase12 tests/phase13
      - name: Phase 12 hardening evidence
        run: |
          python3 scripts/backup_restore_drill.py
          python3 scripts/deps_licence_scan.py
          # Load sample uses local PHP with rate limit disabled (same as unit test).
          PORT=$(python3 -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1]);s.close()')
          HAQQLINE_DISABLE_RATE_LIMIT=1 php -S 127.0.0.1:$PORT -t public public/router.php >/tmp/p12-php.log 2>&1 &
          PHP_PID=$!
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:$PORT/api/v1/health >/dev/null && break; sleep 0.1; done
          HAQQLINE_API_BASE=http://127.0.0.1:$PORT HAQQLINE_LOAD_WORKERS=4 HAQQLINE_LOAD_REQUESTS=20 python3 scripts/load_test.py
          kill $PHP_PID 2>/dev/null || true
      - name: Phase 13 evidence freeze
        run: python3 scripts/freeze_evidence.py
      - name: Playwright
        run: |
          rm -f public/api/data/rate-*.json
          python -m playwright install --with-deps chromium
          HAQQLINE_DISABLE_RATE_LIMIT=1 pytest -q tests/phase3/test_playground.py

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/phase/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rsync
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rsync
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Rsync public/ to document root
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes" \
            --exclude 'cgi-bin' \
            --exclude '.well-known' \
            --exclude 'api/data' \
            public/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${{ secrets.DEPLOY_PATH }}/api/data' && chmod 770 '${{ secrets.DEPLOY_PATH }}/api/data'"
      - name: Smoke HTTPS health and API
        run: |
          curl -fsS --retry 8 --retry-delay 2 https://haqqline.excellonit.net/health
          echo
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          def get(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {})
              with urllib.request.urlopen(req) as res:
                  return res.status, json.loads(res.read().decode())
          status, body = get("https://haqqline.excellonit.net/health")
          assert status == 200 and body["phase"] >= 1
          status, body = get("https://haqqline.excellonit.net/api/v1/health")
          assert status == 200 and body["phase"] >= 2
          key = "haqqline_sandbox_preview"
          req = urllib.request.Request(
              "https://haqqline.excellonit.net/api/v1/tools/lookup_rera_band",
              data=json.dumps({"area":"jlt","current_rent":80000,"proposed_rent":80000}).encode(),
              headers={"Content-Type":"application/json","Authorization":"Bearer "+key},
              method="POST",
          )
          with urllib.request.urlopen(req) as res:
              payload = json.loads(res.read().decode())
              assert res.status == 200
              assert "index_aed" in payload
          print("live api ok")
          PY

  https-home:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke HTTPS home, docs, openapi
        run: |
          html=$(curl -fsS https://haqqline.excellonit.net/)
          echo "$html" | grep -q "not a government service"
          echo "$html" | grep -q "HaqqLine"
          echo "$html" | grep -q "ليس خدمة حكومية"
          curl -fsS https://haqqline.excellonit.net/api/v1/docs/index.html | grep -q "haqqline_sandbox_preview"
          curl -fsS https://haqqline.excellonit.net/api/v1/openapi.json | grep -q lookup_rera_band
          curl -fsS https://haqqline.excellonit.net/play/ | grep -q "Try a case"
          curl -fsS https://haqqline.excellonit.net/play/ | grep -q "جرّب حالة"
          echo "$html" | grep -q "Talk"
          echo "$html" | grep -q "convai-widget-embed"
          echo "$html" | grep -q "sandbox test DID"
          echo "$html" | grep -q 'id="call"'
          echo "$html" | grep -q "/call.js"
          curl -fsS https://haqqline.excellonit.net/twilio.json | grep -q '"inbound_only"'
          curl -fsS https://haqqline.excellonit.net/twilio.json | grep -q '"enable_sms"'
          echo home_ok

  elevenlabs-sync:
    needs: deploy
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/phase/'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rsync
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rsync
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Sync ElevenLabs agent, tests, webhook
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_WEBHOOK_SECRET: ${{ secrets.ELEVENLABS_WEBHOOK_SECRET }}
          HAQQLINE_WEBHOOK_SECRET_FILE: /tmp/elevenlabs_webhook.secret
          HAQQLINE_TEST_REPEAT_COUNT: "3"
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "ELEVENLABS_API_KEY is not set."
            exit 1
          fi
          if [ -n "$ELEVENLABS_WEBHOOK_SECRET" ]; then
            printf '%s' "$ELEVENLABS_WEBHOOK_SECRET" > "$HAQQLINE_WEBHOOK_SECRET_FILE"
          fi
          set +e
          python3 scripts/sync_elevenlabs.py
          sync_rc=$?
          set -e
          # Phase 9: do not promote (rsync) agent config when the eval gate fails.
          if [ "$sync_rc" -eq 0 ]; then
            rsync -avz -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes" \
              public/elevenlabs.json \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/elevenlabs.json"
            if [ -s "$HAQQLINE_WEBHOOK_SECRET_FILE" ]; then
              ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
                "mkdir -p '${{ secrets.DEPLOY_PATH }}/api/data' && cat > '${{ secrets.DEPLOY_PATH }}/api/data/elevenlabs_webhook.secret' && chmod 640 '${{ secrets.DEPLOY_PATH }}/api/data/elevenlabs_webhook.secret'" \
                < "$HAQQLINE_WEBHOOK_SECRET_FILE"
            fi
            python3 - <<'PY'
            import json, urllib.request
            with urllib.request.urlopen("https://haqqline.excellonit.net/elevenlabs.json") as res:
                cfg = json.loads(res.read().decode())
            assert cfg.get("agent_id", "").startswith("agent_"), cfg
            print("live agent", cfg["agent_id"])
            PY
          else
            echo "Promote refused: sync/eval gate exit=$sync_rc (agent JSON not rsynced)."
            exit "$sync_rc"
          fi
      - name: Upload eval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-09-eval
          path: |
            reports/phase-04-eval.json
            reports/phase-05-eval.json
            reports/phase-09-eval.json
          if-no-files-found: ignore

  twilio-sync:
    needs: [deploy, elevenlabs-sync]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/phase/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rsync
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rsync
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Import Twilio DID and assign HaqqLine agent
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TWILIO_API_KEY_SID: ${{ secrets.TWILIO_API_KEY_SID }}
          TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_VOICE_NUMBER: ${{ secrets.TWILIO_VOICE_NUMBER }}
        run: |
          if [ -z "$TWILIO_VOICE_NUMBER" ]; then
            echo "TWILIO_VOICE_NUMBER is not set. Number import skipped; Call page keeps Talk failover."
            python3 - <<'PY'
            import json, urllib.request
            with urllib.request.urlopen("https://haqqline.excellonit.net/twilio.json") as res:
                cfg = json.loads(res.read().decode())
            assert cfg.get("inbound_only") is True, cfg
            assert cfg.get("enable_sms") is False, cfg
            assert "Twilio 5xx" in (cfg.get("failover") or ""), cfg
            print("scaffolding twilio.json ok; phone_number empty=", not cfg.get("phone_number"))
            PY
            exit 0
          fi
          python3 scripts/sync_twilio.py
          rsync -avz -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes" \
            public/twilio.json \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/twilio.json"
          python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen("https://haqqline.excellonit.net/twilio.json") as res:
              cfg = json.loads(res.read().decode())
          assert cfg.get("phone_number", "").startswith("+"), cfg
          assert cfg.get("enable_sms") is False, cfg
          print("live did", cfg["phone_number"])
          PY

  whatsapp-sync:
    needs: [deploy, elevenlabs-sync]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/phase/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rsync
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rsync
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Assign WhatsApp account to HaqqLine agent
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_E164: ${{ secrets.WHATSAPP_E164 }}
        run: |
          if [ -z "$WHATSAPP_PHONE_NUMBER_ID" ] && [ -z "$WHATSAPP_E164" ]; then
            echo "WhatsApp WABA not connected yet. Scaffolding kept; Talk failover."
            HAQQLINE_WHATSAPP_SCAFFOLD_ONLY=1 python3 scripts/sync_whatsapp.py
            python3 - <<'PY'
            import json, urllib.request
            with urllib.request.urlopen("https://haqqline.excellonit.net/whatsapp.json") as res:
                cfg = json.loads(res.read().decode())
            assert cfg.get("connected") is False, cfg
            assert cfg.get("voice_calls") is False, cfg
            assert "STOP" in (cfg.get("stop_policy") or ""), cfg
            print("scaffolding whatsapp.json ok")
            PY
            exit 0
          fi
          python3 scripts/sync_whatsapp.py
          rsync -avz -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes" \
            public/whatsapp.json \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/whatsapp.json"
          python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen("https://haqqline.excellonit.net/whatsapp.json") as res:
              cfg = json.loads(res.read().decode())
          assert cfg.get("connected") is True, cfg
          assert cfg.get("phone_number", "").startswith("+"), cfg
          assert cfg.get("wa_me", "").startswith("https://wa.me/"), cfg
          print("live whatsapp", cfg["phone_number"])
          PY

  sms-sync:
    needs: [deploy]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/phase/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rsync
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rsync
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Publish SMS sandbox config
        env:
          TWILIO_SMS_NUMBER: ${{ secrets.TWILIO_SMS_NUMBER }}
          TWILIO_VOICE_NUMBER: ${{ secrets.TWILIO_VOICE_NUMBER }}
        run: |
          if [ -z "$TWILIO_SMS_NUMBER" ] && [ -z "$TWILIO_VOICE_NUMBER" ]; then
            echo "Twilio SMS number not set. Scaffolding kept; WhatsApp/Talk failover."
            HAQQLINE_SMS_SCAFFOLD_ONLY=1 python3 scripts/sync_sms.py
            python3 - <<'PY'
            import json, urllib.request
            with urllib.request.urlopen("https://haqqline.excellonit.net/sms.json") as res:
                cfg = json.loads(res.read().decode())
            assert cfg.get("connected") is False, cfg
            assert cfg.get("no_rights_check") is True, cfg
            assert "STOP" in (cfg.get("stop_policy") or ""), cfg
            print("scaffolding sms.json ok")
            PY
            exit 0
          fi
          python3 scripts/sync_sms.py
          rsync -avz -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes" \
            public/sms.json \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/sms.json"
          python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen("https://haqqline.excellonit.net/sms.json") as res:
              cfg = json.loads(res.read().decode())
          assert cfg.get("connected") is True, cfg
          assert cfg.get("phone_number", "").startswith("+"), cfg
          print("live sms", cfg["phone_number"])
          PY

  playwright-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwright against production
        env:
          HAQQLINE_PLAY_BASE: https://haqqline.excellonit.net
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          pytest -q tests/phase3/test_playground.py

